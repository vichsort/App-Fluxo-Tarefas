name: ai-agents

# Atendimento via GitHub Actions com a API de IA do próprio dono do repositório (sem Copilot).
# Liga com a variável de repositório AGENT_RUNTIME=github-actions. AGENT_DRY_RUN (variável) fica "true"
# até o ensaio: simula o coordenador sem chamar a IA. Roda sempre a partir da main e nunca executa código
# de PR. Código gerado pela IA só roda (testes e build) no job `codificar`, sem credencial do GitHub com escrita.
#
# AI_PROVIDER=gemini (nível gratuito do Google AI Studio): chave no segredo AI_API_KEY. Ela só entra nos jobs
# `coordenar` e `codificar`, que têm apenas `contents: read`; os jobs com escrita na issue nunca recebem a chave.
# Os jobs trocam entrada.json/saida.json por artifacts desta execução.
#
# Correção (outcome `code`, só com AGENT_DRY_RUN=false): `codificar` (só leitura, com a chave da IA) pede as edições à IA,
# aplica e roda testes e build; `abrir-pr` (escrita, sem IA e sem executar o projeto) revalida, faz commit num branch
# e abre um PR para a main. Nunca há merge automático. Se algo falhar, `correcao-falhou` registra na issue.
#
# O backend dispara este workflow (workflow_dispatch) depois de criar a issue, porque eventos feitos com o
# GITHUB_TOKEN das Actions não iniciam outros workflows. O evento `issues` fica como reforço: a execução
# repetida é inofensiva, pois o estado da issue é relido antes de qualquer chamada à IA.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Número da issue do ticket
        required: true
      retomar:
        description: Repetir depois de uma execução incerta (pode consumir a API da IA de novo)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ai-agents-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  preparar:
    if: vars.AGENT_RUNTIME == 'github-actions' && (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'origin:app'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      chamar: ${{ steps.preparar.outputs.chamar }}
      request_id: ${{ steps.preparar.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar (valida a issue e relê o estado)
        id: preparar
        run: node automacao/actions-controlador.mjs preparar
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_INPUT: ${{ inputs.issue_number }}
          RETOMAR_INPUT: ${{ inputs.retomar }}
          AGENT_ISSUE_AUTHOR: ${{ vars.AGENT_ISSUE_AUTHOR || github.repository_owner }}

      - name: Entregar a entrada ao job da IA
        if: steps.preparar.outputs.chamar == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: entrada
          path: ${{ runner.temp }}/fluxo/entrada.json
          retention-days: 1
          overwrite: true

  coordenar:
    needs: preparar
    if: needs.preparar.outputs.chamar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: entrada
          path: ${{ runner.temp }}/fluxo

      - name: Coordenar (única chamada à IA; sem credencial do GitHub)
        timeout-minutes: 3
        run: node automacao/actions-coordenar.mjs
        env:
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: saida
          path: ${{ runner.temp }}/fluxo/saida.json
          retention-days: 1
          overwrite: true

  publicar:
    needs: [preparar, coordenar]
    if: needs.coordenar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      outcome: ${{ steps.publicar.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: entrada
          path: ${{ runner.temp }}/fluxo
      - uses: actions/download-artifact@v4
        with:
          name: saida
          path: ${{ runner.temp }}/fluxo

      - name: Publicar (valida o relatório fora do modelo)
        id: publicar
        run: node automacao/actions-controlador.mjs publicar
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}

      - name: Guardar o resultado (artifact; a fonte do estado é o comentário na issue)
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ needs.preparar.outputs.request_id }}
          path: ${{ runner.temp }}/fluxo/resultado.json
          retention-days: 7
          overwrite: true

  registrar-incerteza:
    needs: [preparar, coordenar, publicar]
    if: always() && needs.preparar.outputs.chamar == 'true' && needs.publicar.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: entrada
          path: ${{ runner.temp }}/fluxo

      - name: Registrar incerteza (a IA pode ou não ter sido chamada)
        run: node automacao/actions-controlador.mjs falhou
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codificar:
    needs: [preparar, publicar]
    if: needs.publicar.outputs.outcome == 'code' && vars.AGENT_DRY_RUN == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: entrada
          path: ${{ runner.temp }}/fluxo
      - uses: actions/download-artifact@v4
        with:
          name: resultado-${{ needs.preparar.outputs.request_id }}
          path: ${{ runner.temp }}/fluxo
      - name: Instalar dependências (antes de qualquer mudança da IA)
        run: npm ci

      - name: Codificar (até 3 chamadas à IA se as edições forem rejeitadas; sem credencial do GitHub)
        timeout-minutes: 12
        run: node automacao/correcao.mjs codificar
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MODEL_CODIGO: ${{ vars.AI_MODEL_CODIGO }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      # Enviado ANTES de rodar o código editado pela IA: os testes não conseguem trocar as edições.
      - name: Guardar as edições validadas
        uses: actions/upload-artifact@v4
        with:
          name: edicoes
          path: ${{ runner.temp }}/fluxo/edicoes.json
          retention-days: 1
          overwrite: true

      - name: Testes (sem credencial no ambiente)
        run: npm test
      - name: Build
        run: npm run build


  abrir-pr:
    needs: [preparar, codificar]
    if: needs.codificar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: entrada
          path: ${{ runner.temp }}/fluxo
      - uses: actions/download-artifact@v4
        with:
          name: resultado-${{ needs.preparar.outputs.request_id }}
          path: ${{ runner.temp }}/fluxo
      - uses: actions/download-artifact@v4
        with:
          name: edicoes
          path: ${{ runner.temp }}/fluxo

      - name: Abrir PR para a main (revalida; não executa o projeto; sem merge)
        run: node automacao/correcao.mjs abrir-pr
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  correcao-falhou:
    needs: [preparar, publicar, codificar, abrir-pr]
    if: always() && needs.publicar.outputs.outcome == 'code' && vars.AGENT_DRY_RUN == 'false' && needs.abrir-pr.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: entrada
          path: ${{ runner.temp }}/fluxo

      - name: Registrar que a correção não saiu
        run: node automacao/correcao.mjs falhou
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
